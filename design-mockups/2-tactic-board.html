<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Skybox — Tactic Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#1c2627; --board-2:#223032; --frame:#111718; --tray:#2b3638; --tray-hi:#3a4749;
  --chalk:#e9eee9; --chalk-2:#b6c1bd; --chalk-3:#8e9b97;
  --ct:#4c9ce6; --t:#f09a2c; --red:#f0543c; --yellow:#f3d34a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--frame);color:var(--chalk);font-family:Figtree,sans-serif;font-size:14px}
::selection{background:var(--yellow);color:var(--frame)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.hand{font-family:Kalam,cursive}
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 268px;grid-template-rows:60px minmax(0,1fr) 118px;height:100vh;min-height:700px;gap:0}

header{grid-column:1/-1;display:flex;align-items:center;padding:0 18px;gap:18px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand .mk{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd08a,var(--t) 55%,#9a5a10);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.scoreline{flex:1;display:flex;justify-content:center;align-items:center;gap:14px;font-weight:700;font-size:16px}
.scoreline .big{font-family:Kalam;font-size:34px;font-weight:700;line-height:1}
.scoreline .ct{color:var(--ct)} .scoreline .t{color:var(--t)}
.scoreline .rinfo{color:var(--chalk-3);font-weight:500;font-size:13px;margin-left:10px}
.seg{display:flex;background:var(--tray);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--chalk-2)}
.seg button[aria-pressed=true]{background:var(--chalk);color:var(--frame)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--chalk-2)}
.iconbtn:hover{background:var(--tray);color:var(--chalk)}

/* board */
.board{grid-column:2;position:relative;background:var(--board);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.035),transparent 60%);}
.board svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}
.area-edge{filter:url(#rough)}
.area-edge rect{fill:var(--chalk);stroke:var(--chalk);stroke-width:5}
.area-fill rect{fill:var(--board-2)}
.site{fill:url(#hatchRed)}
.site-label{fill:var(--red);font-family:Kalam;font-weight:700;font-size:40px;text-anchor:middle;dominant-baseline:middle;opacity:.9}
.callout{fill:var(--chalk-2);font-family:Kalam;font-size:14px;text-anchor:middle;opacity:.75}
.smoke-body{fill:url(#hatchWhite);stroke:var(--chalk);stroke-width:2.5;filter:url(#rough)}
.smoke-track{fill:none;stroke:rgba(0,0,0,.3);stroke-width:5}
.smoke-ring{fill:none;stroke:var(--chalk);stroke-width:5;stroke-linecap:round}
.flame{fill:var(--red);opacity:.9}
.flash-burst{fill:url(#flashGrad)}
.he-burst{fill:none;stroke:var(--yellow);stroke-width:3;stroke-dasharray:3 5}
.arc{fill:none;stroke-width:2.2;stroke-dasharray:1 7;stroke-linecap:round}
.arc-t{stroke:var(--t)} .arc-ct{stroke:var(--ct)}
.nade circle{fill:var(--chalk);stroke:var(--frame);stroke-width:2}
.p .dot{filter:drop-shadow(0 2.5px 2px rgba(0,0,0,.6))}
.p.t .dot{fill:url(#magT)} .p.ct .dot{fill:url(#magCT)}
.p .dot{r:11px}
.p .aim{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;d:path("M13 0L30 0");}
.p.t{color:var(--t)} .p.ct{color:var(--ct)}
.pnum{fill:#10181a;font-weight:800;font-size:12px;text-anchor:middle;dominant-baseline:middle}
.plabel{fill:var(--chalk);font-family:Kalam;font-size:15px;text-anchor:middle;transform:translateY(5px)}
.blindring{fill:none;stroke:#fff;stroke-width:3;r:18px;display:none;stroke-dasharray:4 3}
.p.blind .blindring{display:block}
.bombtag{fill:var(--red)}
.deathx path{stroke-width:3.5;stroke-linecap:round}
.deathx.t path{stroke:var(--t)} .deathx.ct path{stroke:var(--ct)}
polyline.mpath{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.7;filter:url(#rough)}
.mp0{stroke:#f09a2c;fill:#f09a2c}.mp1{stroke:#f0543c;fill:#f0543c}.mp2{stroke:#f3d34a;fill:#f3d34a}.mp3{stroke:#d38cf0;fill:#d38cf0}.mp4{stroke:#7fe0b4;fill:#7fe0b4}
.mutil{opacity:.55}.mu-smoke{fill:var(--chalk)}.mu-molly{fill:var(--red)}.mu-flash{fill:var(--yellow)}
.ink path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.board.drawing{cursor:crosshair}
.note{position:absolute;left:22px;bottom:14px;font-family:Kalam;color:var(--chalk-3);font-size:14px}
.feed{position:absolute;right:18px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.feed div{font-family:Kalam;font-size:17px;background:rgba(17,23,24,.6);padding:2px 10px;border-radius:6px}
.feed .t{color:var(--t)}.feed .ct{color:var(--ct)}.feed .w{color:var(--chalk-3);font-size:14px}

/* trays */
.tray{padding:6px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tray h2{margin:6px 4px 2px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.tray h2 small{font-weight:500;color:var(--chalk-3);font-size:12px}
.tray.ct h2{color:var(--ct)} .tray.t h2{color:var(--t)}
.card{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto auto;column-gap:10px;row-gap:5px;align-items:center;padding:10px 12px;background:var(--tray);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 3px 8px rgba(0,0,0,.25)}
.mag{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#10181a;box-shadow:0 3px 4px rgba(0,0,0,.5)}
.ct .mag{background:radial-gradient(circle at 34% 28%,#b9dcff,var(--ct) 55%,#1f5ea0)}
.t .mag{background:radial-gradient(circle at 34% 28%,#ffe1ad,var(--t) 55%,#9a5a10)}
.card .nm{font-weight:700;font-size:15px}
.card .money{font-weight:700;color:var(--chalk-2);font-size:13px;text-align:right}
.card .wep{grid-column:2;font-size:12.5px;color:var(--chalk-2)}
.card .ut{grid-column:3;display:flex;gap:2px;color:var(--chalk-2);justify-content:flex-end}
.card .ut .ic{width:15px;height:15px}.card .ut .ic-bomb{color:var(--red)}.card .ut .ic-kit{color:var(--ct)}
.card .hpl{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.hpbar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.hpbar i{display:block;height:100%;border-radius:3px}
.ct .hpbar i{background:var(--ct)} .t .hpbar i{background:var(--t)}
.hpl .v{font-weight:800;font-size:13px;width:28px;text-align:right}
.hpl .ic{width:14px;height:14px;color:var(--chalk-3)}
.card.dead{opacity:.38;box-shadow:none;background:transparent;outline:1.5px dashed var(--tray-hi)}
.card.dead .mag{box-shadow:none;filter:grayscale(1)}
.card.blind .mag{outline:3px dashed #fff;outline-offset:2px}
/* multi-round tray states */
.st{display:flex;flex-direction:column;gap:10px}
.mt{display:none}
.multi .mt{display:flex} .multi .st{display:none}
.mt{flex-direction:column;gap:8px}
.mcount{font-family:Kalam;font-size:24px;margin:4px 4px 0}
.mcount span{font-family:Figtree;font-size:12px;color:var(--chalk-3);display:block;margin-top:-4px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--tray);font-weight:700;text-align:left}
.pick .mag{width:24px;height:24px;font-size:11px}
.pick[aria-pressed=false]{background:transparent;color:var(--chalk-3);outline:1.5px dashed var(--tray-hi)}
.pick[aria-pressed=false] .mag{filter:grayscale(1);opacity:.4;box-shadow:none}
.pick .state{margin-left:auto;font-weight:500;font-size:12px;color:var(--chalk-3)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{height:40px;border-radius:10px;display:grid;place-items:center;background:var(--tray);color:var(--chalk-3)}
.chip .ic{width:19px;height:19px}
.chip[aria-pressed=true]{background:var(--chalk);color:var(--frame)}
.lbl{font-size:12px;font-weight:600;color:var(--chalk-3);margin:6px 4px 0}
.tick{display:flex;gap:10px;align-items:center;padding:6px 4px;color:var(--chalk-2);font-weight:500;text-align:left}
.tick i{width:18px;height:18px;border-radius:5px;background:var(--tray);display:grid;place-items:center}
.tick[aria-pressed=true] i{background:var(--chalk)}
.tick[aria-pressed=true] i::after{content:"";width:8px;height:4px;border:2.2px solid var(--frame);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.linkbtn{color:var(--yellow);font-family:Kalam;font-size:16px;text-align:left;padding:2px 4px}
.resetbtn{display:flex;gap:8px;align-items:center;justify-content:center;padding:9px;border-radius:10px;background:var(--tray);font-weight:600;margin-top:4px}

/* bottom rail */
.rail{grid-column:1/-1;display:grid;grid-template-columns:268px minmax(0,1fr) 268px;align-items:center;padding:6px 0 12px}
.transport{display:flex;align-items:center;gap:8px;padding-left:18px}
.play{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#dfe6e2 60%,#9aa7a2);color:var(--frame);display:grid;place-items:center;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.play .ic{width:20px;height:20px}
.clock{font-weight:800;font-size:30px;margin-left:8px;letter-spacing:-.02em}
.spd{padding:6px 10px;border-radius:999px;background:var(--tray);font-weight:700;font-size:13px}
.mid{display:flex;flex-direction:column;gap:10px;padding:0 10px}
.tokens{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.tok{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#10181a;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.tok.ct{background:radial-gradient(circle at 34% 28%,#b9dcff,var(--ct) 60%,#1f5ea0)}
.tok.t{background:radial-gradient(circle at 34% 28%,#ffe1ad,var(--t) 60%,#9a5a10)}
.tok[aria-current=true]{outline:2.5px solid var(--chalk);outline-offset:2px}
.multi .tok:not(.sel){filter:grayscale(1);opacity:.35;box-shadow:none}
.halfgap{width:1px;height:22px;background:var(--tray-hi);margin:0 6px;flex:none}
.tl{position:relative;height:40px}
.tl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl .base{stroke:var(--chalk-2);stroke-width:3;stroke-linecap:round;filter:url(#rough)}
.tl .tk{stroke:var(--chalk-3);stroke-width:1.5}
.tl .kill{stroke-width:3;stroke-linecap:round}
.tl .kill.t{stroke:var(--t)}.tl .kill.ct{stroke:var(--ct)}
.tl .bomb{fill:rgba(240,84,60,.18);stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 3}
.tl .lab{fill:var(--chalk-3);font-size:11px;text-anchor:middle;font-family:Figtree}
.tl .blab{fill:var(--red);font-family:Kalam;font-size:14px}
.tl .head{fill:var(--chalk);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.tl .scrub{fill:transparent;cursor:pointer}
.markers{display:flex;gap:10px;justify-content:flex-end;align-items:flex-end;padding-right:18px;height:64px}
.marker{width:22px;height:48px;border-radius:5px 5px 3px 3px;position:relative;background:#e4e8e6;box-shadow:0 3px 5px rgba(0,0,0,.45);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.marker::before{content:"";position:absolute;left:3px;right:3px;top:-9px;height:12px;border-radius:4px 4px 0 0;background:var(--c)}
.marker[aria-pressed=true]{transform:translateY(-10px)}
.marker.eraser{background:#3b4749;height:30px;width:34px;border-radius:5px}
.marker.eraser::before{display:none}
.marker.eraser .ic{position:absolute;inset:0;margin:auto;color:var(--chalk-2)}
.hint{font-size:11.5px;color:var(--chalk-3);text-align:right;padding-right:18px;margin-top:-4px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto auto auto;height:auto}
  header{flex-wrap:wrap;padding:10px 14px}.scoreline{order:3;flex-basis:100%;justify-content:flex-start}
  .board{grid-column:1;margin:0 10px}.tray{grid-row:4}.tray.t{grid-row:5}
  .rail{grid-row:3;grid-template-columns:1fr}.markers,.hint{display:none}
}
</style></head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span class="mk"></span>Open Skybox</div>
    <div class="scoreline"><span class="ct">Northgate</span><span class="big num"><span class="ct">3</span> : <span class="t">3</span></span><span class="t">Vanta</span><span class="rinfo">Mirage · Round 7 of 23</span></div>
    <div class="seg" role="group" aria-label="Replay mode"><button id="m-single" aria-pressed="true">This round</button><button id="m-multi" aria-pressed="false">Stack rounds</button></div>
    <button class="iconbtn" id="keysbtn" title="Hotkeys (H)"></button><button class="iconbtn" id="gearbtn" title="Settings"></button>
  </header>
  <aside class="tray ct" id="tray-ct">
    <div class="st" id="cards-ct"></div>
    <div class="mt" id="mt-ct"></div>
  </aside>
  <main class="board" id="board">
    <svg id="map"></svg>
    <div class="feed" id="feed"></div>
    <div class="note">schematic map · synthetic data</div>
  </main>
  <aside class="tray t" id="tray-t">
    <div class="st" id="cards-t"></div>
    <div class="mt" id="mt-t"></div>
  </aside>
  <div class="rail">
    <div class="transport"><button class="iconbtn" id="prev" title="Previous round (J)"></button><button class="play" id="play" title="Play / pause (Space)"></button><button class="iconbtn" id="next" title="Next round (K)"></button><span class="clock num" id="clock">1:12</span><button class="spd num" id="spd">1×</button></div>
    <div class="mid"><div class="tokens" id="tokens"></div><div class="tl"><svg id="tl"></svg></div></div>
    <div><div class="markers" id="markers"></div><div class="hint">Pick a marker to draw on the board · C clears</div></div>
  </div>
</div>

const UTIL = [
  {type:'smoke', by:'b1tter', from:[700,730], to:[395,675], throwT:36.5, det:38.5, dur:18},

function el(tag, attrs={}, parent){ const e=document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }

function lerpPath(path, t){
  if(t<=path[0][0]) return path[0].slice(1);
  for(let i=1;i<path.length;i++){ const a=path[i-1], b=path[i]; if(t<=b[0]){ const f=(t-a[0])/(b[0]-a[0]); let dy=b[3]-a[3]; if(dy>180) dy-=360; if(dy<-180) dy+=360; return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+dy*f]; } }
  return path[path.length-1].slice(1);
}
function hpAt(p,t){ let h=p.hp[0][1]; for(const [tt,v] of p.hp) if(t>=tt) h=v; if(p.death!==null && t>=p.death) h=0; return h; }
function isDead(p,t){ return p.death!==null && t>=p.death; }
function isBlind(p,t){ return BLIND.some(b=>b.id===p.id && t>=b.from && t<b.to); }
function fmtClock(t){ const s=Math.max(0,Math.ceil(ROUND_LEN-t)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function fmtElapsed(t){ const s=Math.round(t); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function arcPoint(u, f){ // quadratic arc between from/to, bulging "up" on screen
  const [x1,y1]=u.from, [x2,y2]=u.to, mx=(x1+x2)/2, my=(y1+y2)/2 - Math.hypot(x2-x1,y2-y1)*0.22;

}
function arcD(u){ const [x1,y1]=u.from, [x2,y2]=u.to, mx=(x1+x2)/2, my=(y1+y2)/2 - Math.hypot(x2-x1,y2-y1)*0.22; return `M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}`; }

function buildMap(svg, opts={}){

/* Build the live layers once; update() moves them per frame without rebuilding. */
function buildReplay(svg, opts={}){
  const L = {};
  L.util = el('g',{class:'layer-util'},svg);
  L.arcs = el('g',{class:'layer-arcs'},svg);
  L.marks = el('g',{class:'layer-marks'},svg);
  L.players = el('g',{class:'layer-players'},svg);
  L.fx = el('g',{class:'layer-fx'},svg);
  const U = UTIL.map(u=>{
    const o={u};
    if(u.type==='smoke'){ o.g=el('g',{class:'smoke'},L.util); el('circle',{class:'smoke-body',cx:u.to[0],cy:u.to[1],r:30},o.g); el('circle',{class:'smoke-track',cx:u.to[0],cy:u.to[1],r:13},o.g); o.ring=el('circle',{class:'smoke-ring',cx:u.to[0],cy:u.to[1],r:13,transform:`rotate(-90 ${u.to[0]} ${u.to[1]})`},o.g); }
    if(u.type==='molly'){ o.g=el('g',{class:'molly'},L.util); const pts=[[0,0],[12,-6],[-12,5],[6,11],[-7,-10],[20,6],[-19,-3],[2,-17],[14,15],[-14,14],[23,-8],[-3,20],[9,-14],[-22,9]]; pts.forEach(([dx,dy],i)=>el('circle',{class:'flame',cx:u.to[0]+dx,cy:u.to[1]+dy,r:5.2,style:`--i:${i}`},o.g)); }
    if(u.type==='flash'){ o.g=el('g',{class:'flashfx'},L.fx); o.c=el('circle',{class:'flash-burst',cx:u.to[0],cy:u.to[1],r:70},o.g); }
    if(u.type==='he'){ o.g=el('g',{class:'hefx'},L.fx); o.c=el('circle',{class:'he-burst',cx:u.to[0],cy:u.to[1],r:26},o.g); }
    o.arc=el('path',{class:`arc arc-${u.type} arc-${byId[u.by].team}`,d:arcD(u)},L.arcs);
    o.nade=el('g',{class:`nade nade-${byId[u.by].team}`},L.arcs); el('circle',{r:5},o.nade);
    return o;
  });
  const P = PLAYERS.map(p=>{
    const g=el('g',{class:`p ${p.team}`},L.players);
    const blind=el('circle',{class:'blindring',r:15},g);
    const cone=el('path',{class:'aim',d:'M0 0L26 -7A27 27 0 0 1 26 7Z'},g);
    const dot=el('circle',{class:'dot',r:8.5},g);
    const num=el('text',{class:'pnum',y:0.5},g); num.textContent = p.slot===10?'0':p.slot;
    const lab=el('text',{class:'plabel',y:22},g); lab.textContent=p.id;
    let bomb=null; if(p.bomb){ bomb=el('rect',{class:'bombtag',x:5,y:-12,width:7,height:5,rx:1},g); }
    const x=el('g',{class:'deathx'},L.marks); el('path',{d:'M-6 -6L6 6M6 -6L-6 6'},x);
    return {p,g,cone,x,blind,lab};
  });
  function update(t){
    for(const o of U){ const u=o.u;
      const inFlight = t>=u.throwT && t<u.det;
      o.nade.style.display = inFlight?'':'none';
      if(inFlight){ const f=(t-u.throwT)/(u.det-u.throwT); const [x,y]=arcPoint(u,f); o.nade.setAttribute('transform',`translate(${x} ${y})`); }
      const active = t>=u.det && t<u.det+u.dur;
      o.arc.style.display = (t>=u.throwT && t<u.det+Math.min(u.dur,3))?'':'none';
      if(o.g) o.g.style.display = active?'':'none';
      if(u.type==='smoke' && active){ const left=1-(t-u.det)/u.dur, C=2*Math.PI*13; o.ring.setAttribute('stroke-dasharray',`${C*left} ${C}`); }
      if((u.type==='flash'||u.type==='he') && active){ o.g.style.opacity = String(1-(t-u.det)/u.dur); }
    }
    for(const o of P){ const p=o.p, dead=isDead(p,t), [x,y,yaw]=lerpPath(p.path,t);
      o.g.style.display = dead?'none':''; o.x.style.display = dead?'':'none';
      if(dead){ const [dx,dy]=lerpPath(p.path,p.death); o.x.setAttribute('transform',`translate(${dx} ${dy})`); o.x.setAttribute('class',`deathx ${p.team}`); }
      o.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      o.cone.setAttribute('transform',`rotate(${yaw.toFixed(1)})`);
      o.g.classList.toggle('blind', isBlind(p,t));
    }
  }
  return {update, L};
}

const ROUTES = {
  ramp:[[890,480],[840,600],[740,605],[680,640],[560,700]],
  palace:[[890,500],[850,650],[780,730],[660,745],[520,760]],

function seeded(s){ return ()=> (s = (s*16807)%2147483647)/2147483647; }
function buildMulti(svg, sel){
  const g=el('g',{class:'layer-multi'},svg);
  const rnd=seeded(7);
  const tPlayers = PLAYERS.filter(p=>p.team==='t');
  const rounds = ROUNDS.filter(r=>r.n<=12);
  rounds.forEach((r,ri)=>{
    tPlayers.forEach((p,pi)=>{
      if(sel && !sel.has(p.id)) return;
      const keys=Object.keys(ROUTES); const route=ROUTES[keys[(pi+ri*(pi%2?1:3))%4]];
      const pts=route.map(([x,y])=>[x+(rnd()-.5)*26,y+(rnd()-.5)*22]);
      const cut = 2+Math.floor(rnd()*(pts.length-2)); const used=pts.slice(0,cut+1);
      el('polyline',{class:`mpath mp${pi}`,fill:'none',points:used.map(q=>q.join(',')).join(' ')},g);
      const end=used[used.length-1];
      if(rnd()<0.45) { const x=el('g',{class:'deathx t',transform:`translate(${end[0]} ${end[1]})`},g); el('path',{d:'M-5 -5L5 5M5 -5L-5 5'},x); }
      else el('circle',{class:`mend mp${pi}`,cx:end[0],cy:end[1],r:4},g);
    });
    // utility landings for that round
    for(const u of UTIL.filter(u=>u.type!=='he')){ el('circle',{class:`mutil mu-${u.type}`,cx:u.to[0]+(rnd()-.5)*30,cy:u.to[1]+(rnd()-.5)*30,r:u.type==='smoke'?8:5},g); }
  });
  return g;
}

/* Playback clock shared by every design. */
function makeClock(onFrame){
  const s={t:T0, playing:false, speed:1, last:0};
  function tick(now){ if(!s.playing) return; const dt=(now-(s.last||now))/1000; s.last=now; s.t+=dt*s.speed; if(s.t>ROUND_LEN) s.t=30; onFrame(s.t); requestAnimationFrame(tick); }
  s.play=()=>{ if(s.playing) return; s.playing=true; s.last=0; requestAnimationFrame(tick); };
  s.pause=()=>{ s.playing=false; };
  s.toggle=()=> s.playing?s.pause():s.play();
  s.seek=(t)=>{ s.t=Math.max(0,Math.min(ROUND_LEN,t)); onFrame(s.t); };
  return s;
}

let stroke=null, pts='';
svg.addEventListener('pointerdown',e=>{ if(!pen) return; const q=svgPt(e); pts=`M${q.x.toFixed(1)} ${q.y.toFixed(1)}`; stroke=el('path',{d:pts,stroke:pen},ink); svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!stroke) return; const q=svgPt(e); pts+=`L${q.x.toFixed(1)} ${q.y.toFixed(1)}`; stroke.setAttribute('d',pts); });
svg.addEventListener('pointerup',()=>stroke=null);
// sample annotation so the board reads as a board
el('path',{d:'M770 225 C 720 250, 650 290, 610 332',stroke:'#f3d34a'},ink); el('path',{d:'M603 316 l6 17 l15 -8',stroke:'#f3d34a'},ink);
const noteT=el('text',{x:560,y:262,fill:'#f3d34a','font-family':'Kalam','font-size':18},ink); noteT.textContent='lurk → mid?';
// frame
const clock=makeClock(frame);
function frame(t){
  R.update(t); $('#clock').textContent=fmtClock(t); if(head) head.setAttribute('transform',`translate(${X(t)} 3)`);
  for(const c of cards){ const h=hpAt(c.p,t); c.v.textContent=h; c.b.style.width=h+'%'; c.c.classList.toggle('dead',isDead(c.p,t)); c.c.classList.toggle('blind',isBlind(c.p,t)); }
  $('#feed').innerHTML=killsBefore(t).slice(-4).map(k=>`<div><span class="${byId[k.k].team}">${k.k}</span> <span class="w">${k.w}${k.hs?' · headshot':''}</span> <span class="${byId[k.v].team}">✕ ${k.v}</span></div>`).join('');
  $('#play').innerHTML=icon(clock.playing?'pause':'play');
}
$('#play').onclick=()=>{clock.toggle();frame(clock.t);};
const speeds=[0.5,1,2,4]; let si=1; $('#spd').onclick=()=>{ si=(si+1)%4; clock.speed=speeds[si]; $('#spd').textContent=speeds[si]+'×'; };
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();clock.toggle();frame(clock.t);} if(e.key==='ArrowRight') clock.seek(clock.t+(e.shiftKey?1:5)); if(e.key==='ArrowLeft') clock.seek(clock.t-(e.shiftKey?1:5)); if(e.key==='c'||e.key==='C') ink.innerHTML=''; });
// multi-round
const sel=new Set(['sokol','juno']); let multiLayer=null; const kinds=['molly','flash','smoke','decoy','he'];
function mtHTML(){
  const tp=PLAYERS.filter(p=>p.team==='t');
  $('#mt-t').innerHTML=`<div class="mcount"><span id="rc">12</span> rounds stacked<span>Vanta on T side · tap round tokens below to add or remove</span></div>
   ${tp.map((p,i)=>`<button class="pick t" data-id="${p.id}" aria-pressed="${sel.has(p.id)}"><span class="mag num">${p.slot}</span>${p.id}<span class="state">${sel.has(p.id)?'on board':'in tray'}</span></button>`).join('')}
   <button class="linkbtn" id="allp">put all five on the board</button>
   <div class="lbl">Their utility</div><div class="chips">${kinds.map(u=>`<button class="chip" aria-pressed="${u==='smoke'||u==='molly'}" title="${u}">${icon(u)}</button>`).join('')}</div>`;
  $('#mt-ct').innerHTML=`<h2 style="color:var(--ct)">Northgate<small>opponents</small></h2>
   <button class="tick" aria-pressed="false"><i></i>Show enemy players</button>
   <div class="lbl">Enemy utility</div><div class="chips">${kinds.map(u=>`<button class="chip" aria-pressed="false" title="${u}">${icon(u)}</button>`).join('')}</div>
   <div class="lbl">On the board</div><button class="tick" aria-pressed="false"><i></i>Bomb</button><button class="tick" aria-pressed="true"><i></i>Dropped utility</button>
   <button class="resetbtn" id="reset">${icon('reset')}Reset</button>`;
  countRounds();
}
function countRounds(){ const e=$('#rc'); if(e) e.textContent=document.querySelectorAll('.tok.sel').length; }
document.querySelectorAll('.mt').forEach(m=>m.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.classList.contains('pick')){ const id=b.dataset.id; sel.has(id)?sel.delete(id):sel.add(id); redraw(); mtHTML(); return; }
  if(b.id==='allp'){ PLAYERS.filter(p=>p.team==='t').forEach(p=>sel.add(p.id)); redraw(); mtHTML(); return; }
  if(b.id==='reset'){ sel.clear(); sel.add('sokol'); sel.add('juno'); redraw(); mtHTML(); return; }
  if(b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true'); }));
function redraw(){ if(multiLayer) multiLayer.remove(); multiLayer=buildMulti(svg,sel); svg.appendChild(ink); }
function setMode(m){ $('#app').classList.toggle('multi',m); $('#m-multi').setAttribute('aria-pressed',m); $('#m-single').setAttribute('aria-pressed',!m);
  Object.values(R.L).forEach(l=>l.style.display=m?'none':''); $('#feed').style.display=m?'none':''; if(m){ clock.pause(); redraw(); mtHTML(); } else if(multiLayer){ multiLayer.remove(); multiLayer=null; } frame(clock.t); }
$('#m-multi').onclick=()=>setMode(true); $('#m-single').onclick=()=>setMode(false);
addEventListener('resize',drawTL);
drawTL(); if(location.hash==='#multi') setMode(true); frame(T0);
</script>
</body></html>
